name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["index.html", "manifest.json", "offline.html", ".github/workflows/build-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html offline.html manifest.json icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Polski Daily" com.weichen.polskidaily --web-dir www
          npx cap add android
          npx cap sync android

      - name: Use our icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-512.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: polski-daily-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
