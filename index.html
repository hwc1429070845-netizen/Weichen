const SENTENCES = CATEGORIES.flatMap((cat,ci)=>cat.sentences.map((s,si)=>({id:`${ci}-${si}`,pl:s[0],cn:s[1],cat:cat.name})));
const KEY='polskiDailyProgress_v1';
let progress={learned:[],later:[]}, view='learn', currentId=null, searchText='';
try{progress={...progress,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){} updateCounts()}
function updateCounts(){
 $('#learnedCount').textContent=progress.learned.length;$('#laterCount').textContent=progress.later.length;
 $('#allCount').textContent=SENTENCES.length;$('#todoCount').textContent=SENTENCES.length-progress.learned.length;
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
}
function speak(text){
 if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音合成');return}
 speechSynthesis.cancel();
 const utter=new SpeechSynthesisUtterance(text);utter.lang='pl-PL';utter.rate=.88;utter.pitch=1;
 const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase()==='pl-pl')||voices.find(x=>x.lang.toLowerCase().startsWith('pl'));
 if(v)utter.voice=v;
 speechSynthesis.speak(utter);
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
function nextTodo(){return SENTENCES.find(s=>!progress.learned.includes(s.id)&&!progress.later.includes(s.id))||SENTENCES.find(s=>!progress.learned.includes(s.id))||SENTENCES[0]}
function setView(v){view=v;render()}
function render(){
 updateCounts();const main=$('#main');
 if(view==='learn'){
   if(!currentId||!SENTENCES.some(s=>s.id===currentId)||progress.learned.includes(currentId))currentId=nextTodo().id;
   const s=SENTENCES.find(x=>x.id===currentId);const learned=progress.learned.length;
   const catIndex=CATEGORIES.findIndex(c=>c.name===s.cat);
   main.innerHTML=`<div class="lesson-head"><span class="pill">✦ ${s.cat}</span><div class="progress-wrap"><span>已掌握 ${learned} / ${SENTENCES.length}</span><div class="progress"><span style="width:${learned/SENTENCES.length*100}%"></span></div></div></div>
   <div class="kicker">LIFE POLISH · 生活高频句</div><div class="sentence-row"><h2 class="polish">${esc(s.pl)}</h2><button class="play" aria-label="播放波兰语发音" title="播放波兰语发音" onclick="speakById('${s.id}')"><svg viewBox="0 0 24 24"><path d="M8 5.14v13.72c0 .78.85 1.26 1.52.86l10.3-6.86a1.03 1.03 0 0 0 0-1.72L9.52 4.28A1 1 0 0 0 8 5.14z"/></svg></button></div>
   <p class="translation">${esc(s.cn)}</p><div class="divider"></div><div class="hint"><span>◉</span><span>先听一遍，再大声跟读。注意：这是浏览器提供的波兰语语音；具体音色取决于设备和系统。</span></div><div class="spacer"></div>
   <div class="actions"><button class="btn success" onclick="markLearned('${s.id}')">✓ 我学会了</button><button class="btn defer" onclick="markLater('${s.id}')">◷ 以后再学</button><button class="btn primary" onclick="speakById('${s.id}')">▶ 再听一次</button><span class="shortcut">快捷键：← 以后再学 · Enter 学会</span></div>`;
 }else{
   const title={learned:'已学会',later:'以后再学',all:'全部句子'}[view]||'全部句子';
   let arr=view==='learned'?SENTENCES.filter(s=>progress.learned.includes(s.id)):view==='later'?SENTENCES.filter(s=>progress.later.includes(s.id)):SENTENCES;
   if(searchText)arr=arr.filter(s=>(s.pl+' '+s.cn+' '+s.cat).toLowerCase().includes(searchText.toLowerCase()));
   main.innerHTML=`<div class="lesson-head"><span class="pill">▤ 句子库</span><span class="progress-wrap">${arr.length} 个句子</span></div><h2 class="view-title">${title}</h2><p class="view-sub">点击喇叭听发音。学习进度保存在当前浏览器。</p><input class="search" id="search" placeholder="搜索波兰语、中文或场景…" value="${esc(searchText)}" oninput="updateSearch(this.value)"><div class="list" id="sentenceList">${arr.length?arr.map(s=>`<div class="item"><div class="item-main"><p class="item-pl">${esc(s.pl)}</p><p class="item-cn">${esc(s.cn)} <span style="font-size:11px">· ${esc(s.cat)}</span></p></div><div class="item-actions"><button class="icon-btn" title="播放发音" aria-label="播放发音" onclick="speakById('${s.id}')">▶</button>${view!=='learned'?`<button class="icon-btn" title="标记学会" onclick="markLearned('${s.id}',true)">✓</button>`:`<button class="icon-btn" title="重新学习" onclick="unlearn('${s.id}')">↶</button>`}${view!=='later'?`<button class="icon-btn" title="以后再学" onclick="markLater('${s.id}',true)">◷</button>`:`<button class="icon-btn" title="放回学习队列" onclick="unlater('${s.id}')">＋</button>`}</div></div>`).join(''):`<div class="empty"><b>这里暂时没有句子</b>可以继续学习，或尝试其他搜索内容。</div>`}</div><div style="margin-top:18px"><button class="btn primary" onclick="setView('learn')">返回逐句学习</button></div>`;
 }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speakById(id){const s=SENTENCES.find(x=>x.id===id);if(s)speak(s.pl)}
function markLearned(id,stay=false){if(!progress.learned.includes(id))progress.learned.push(id);progress.later=progress.later.filter(x=>x!==id);save();toast('已加入「已学会」');if(view==='learn'&&!stay){currentId=nextTodo().id;render()}else render()}
function markLater(id,stay=false){if(!progress.later.includes(id)&&!progress.learned.includes(id))progress.later.push(id);save();toast('已加入「以后再学」');if(view==='learn'&&!stay){currentId=nextTodo().id;render()}else render()}
function unlearn(id){progress.learned=progress.learned.filter(x=>x!==id);save();render()}
function unlater(id){progress.later=progress.later.filter(x=>x!==id);save();render()}
function updateSearch(v){searchText=v;const pos=v.length;render();const input=$('#search');if(input){input.focus();input.setSelectionRange(pos,pos)}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#resetProgress').addEventListener('click',()=>{if(confirm('确定清空全部已学会和以后再学记录吗？此操作无法撤销。')){progress={learned:[],later:[]};currentId=null;save();setView('learn');toast('学习进度已重置')}});
document.addEventListener('keydown',e=>{if(view!=='learn'||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='Enter'){e.preventDefault();if(currentId)markLearned(currentId)}if(e.key==='ArrowLeft'&&currentId)markLater(currentId)});
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
