.btn.later{color:#9a600e}
.bottom{margin-top:16px;font-size:13px;color:var(--muted)}
h2{font-size:25px;margin:12px 0}
.search{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;margin:10px 0 17px}

.item{border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;gap:12px;align-items:center}

.item-cn{font-size:13px;color:var(--muted);margin:0}
.item button{border:1px solid var(--border);background:white;border-radius:9px;padding:8px}

 const saved=localStorage.getItem(KEY);
 if(saved) progress={...progress,...JSON.parse(saved)};
}catch(e){console.error("读取缓存失败", e);}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 保存到本地缓存
function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(progress));
 }catch(e){console.error("保存缓存失败", e);}
}

function toast(s){const t=$("#toast");t.textContent=s;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",1800)}

// 语音朗读（使用浏览器内置 TTS，解决 GitHub 的 HTTPS 外链拦截问题）
function speak(text){
 if(!("speechSynthesis"in window)){toast("此浏览器不支持语音朗读");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="pl-PL";
 u.rate=.88;
 const voices=speechSynthesis.getVoices();
 const v=voices.find(x=>x.lang.toLowerCase()==="pl-pl")||voices.find(x=>x.lang.toLowerCase().startsWith("pl"));
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}
if("speechSynthesis" in window){
 window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

 $("#todoCount").textContent=sentences.length-progress.learned.length;
 $("#learnedCount").textContent=progress.learned.length;
 $("#laterCount").textContent=progress.later.length;
 $("#allCount").textContent=sentences.length;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
}
function render(){
 counts();const main=$("#main");
 if(view==="learn"){
  if(!current||!sentences.some(s=>s.id===current)||progress.learned.includes(current))current=nextSentence().id;
  const s=sentences.find(x=>x.id===current);
  main.innerHTML=`<div class="meta"><span class="tag">${esc(s.cat)}</span><span>已学会 ${progress.learned.length} / ${sentences.length}</span></div>
  <div class="progress"><div style="width:${progress.learned.length/sentences.length*100}%"></div></div>
  <div class="kicker">POLSKI DAILY · 生活高频句</div>
  <div class="sentence"><h2 class="polish">${esc(s.pl)}</h2><button class="play" aria-label="播放发音" onclick="playId('${s.id}')">▶</button></div>
  <p class="translation">${esc(s.cn)}</p>
  <p class="tip">先听发音，再大声跟读。您的学习进度已自动保存在当前浏览器中，下次打开会直接恢复。</p>
  <div class="actions"><button class="btn good" onclick="learn('${s.id}')">✓ 我学会了</button><button class="btn later" onclick="defer('${s.id}')">◷ 以后再学</button><button class="btn primary" onclick="playId('${s.id}')">▶ 再听一次</button></div>`;
 }else{
  const title={learned:"已学会",later:"以后再学",all:"全部句子"}[view];
  let arr=sentences.filter(s=>view==="all"||(view==="learned"?progress.learned:progress.later).includes(s.id));
  if(query)arr=arr.filter(s=>(s.pl+" "+s.cn+" "+s.cat).toLowerCase().includes(query.toLowerCase()));
  main.innerHTML=`<div class="meta"><span class="tag">句子库</span><span>${arr.length} 个句子</span></div><h2>${title}</h2><input class="search" id="search" placeholder="搜索波兰语、中文或场景…" value="${esc(query)}"><div class="list">${arr.length?arr.map(s=>`<div class="item"><div class="item-main"><p class="item-pl">${esc(s.pl)}</p><p class="item-cn">${esc(s.cn)} ·${esc(s.cat)}</p></div><button aria-label="播放发音" onclick="playId('${s.id}')">▶</button>${progress.learned.includes(s.id)?`<button onclick="unlearn('${s.id}')">↶</button>`:`<button onclick="learn('${s.id}',true)">✓</button>`}${progress.later.includes(s.id)?`<button onclick="undefer('${s.id}')">＋</button>`:`<button onclick="defer('${s.id}',true)">◷</button>`}</div>`).join(""):'<div class="empty">这里暂时没有句子。</div>'}</div><div class="actions"><button class="btn primary" onclick="setView('learn')">返回逐句学习</button></div>`;
  $("#search").addEventListener("input",e=>{const p=e.target.selectionStart;query=e.target.value;render();$("#search").focus();$("#search").setSelectionRange(p,p)});
 }
}
function playId(id){const s=sentences.find(x=>x.id===id);if(s)speak(s.pl)}
function learn(id,stay=false){if(!progress.learned.includes(id))progress.learned.push(id);progress.later=progress.later.filter(x=>x!==id);save();toast("已保存到「已学会」");if(view==="learn"&&!stay)current=nextSentence().id;render()}
function defer(id,stay=false){if(!progress.learned.includes(id)&&!progress.later.includes(id))progress.later.push(id);save();toast("已保存到「以后再学」");if(view==="learn"&&!stay)current=nextSentence().id;render()}
function unlearn(id){progress.learned=progress.learned.filter(x=>x!==id);save();render()}
function undefer(id){progress.later=progress.later.filter(x=>x!==id);save();render()}
function setView(v){view=v;query="";render()}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
document.addEventListener("keydown",e=>{if(view!=="learn"||["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;if(e.key==="Enter"&&current)learn(current);if(e.key==="ArrowLeft"&&current)defer(current)});
render();
</script>
</body>
</html>
