  <style>
    :root {

      --border: #e8ebf2;

    * { box-sizing: border-box; }

    body {

      background: var(--bg);

      line-height: 1.6;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-name { font-size: 19px; font-weight: 800; }
    .brand-sub { font-size: 12px; color: var(--muted); }

    .progress-pill {
      background: white;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 13px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .hero { margin-bottom: 25px; }

    .eyebrow {
      color: var(--primary);
      font-weight: 750;
      font-size: 12px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.2;
      letter-spacing: -1.3px;
      margin: 10px 0;
    }

    .hero p {
      margin: 0;
      max-width: 600px;
      color: var(--muted);
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .stat-number { font-size: 25px; font-weight: 800; }
    .stat-label { font-size: 12px; color: var(--muted); }

    .toolbar {
      background: white;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafbfe;
      padding: 13px 14px 13px 42px;
      outline: none;
      color: var(--text);
    }

    #search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(49, 94, 251, .1);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: white;
      color: #596277;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      transition: .15s;
    }

    .filter-btn:hover { border-color: #b8c5ff; }

    .filter-btn.active {
      background: var(--primary-light);
      border-color: #d5ddff;
      color: var(--primary);
      font-weight: 700;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 27px 0 13px;
    }

    .section-heading h2 { margin: 0; font-size: 19px; }
    #result-count { color: var(--muted); font-size: 13px; }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sentence-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }

    .sentence-card.learned {
      border-color: #bce8d4;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .sentence-main { min-width: 0; flex: 1; }

    .category {
      display: inline-block;
      background: #f0f2f8;
      color: #69738a;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 7px;
      margin-bottom: 9px;
    }

    .polish {
      font-size: clamp(18px, 3vw, 21px);
      font-weight: 750;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .chinese {
      margin-top: 5px;
      font-size: 14px;
      color: var(--muted);
    }

    .play-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: none;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: .15s;
    }

    .play-btn:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.04);
    }

    .play-btn:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid #f0f1f5;
      margin-top: 15px;
      padding-top: 12px;
    }

    .action-btn {
      border: 1px solid var(--border);
      background: white;
      color: #69738a;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .action-btn:hover { background: #f7f8fc; }

    .action-btn.is-learned {
      color: var(--green);
      border-color: #bce8d4;
      background: #f0fbf5;
    }

    .action-btn.is-later {
      color: var(--orange);
      border-color: #f1d8b5;
      background: #fff8ed;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty-icon { font-size: 34px; margin-bottom: 8px; }

    .notice {
      margin-top: 24px;
      border-radius: 12px;
      padding: 12px 14px;
      color: #68738a;
      background: #eef1f8;

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #9aa1b1;

      .stat { padding: 12px; }
      .stat-number { font-size: 21px; }
      .toolbar { padding: 12px; }
      .sentence-card { padding: 15px; }
      .filters { gap: 6px; }
      .filter-btn { padding: 7px 9px; font-size: 12px; }
    }
  </style>
</head>

      {c:"办事与文件",p:"Mam umówioną wizytę.",z:"我已经预约了。"},
      {c:"办事与文件",p:"Przyszedłem w sprawie karty pobytu.",z:"我是来办理居留卡的。（男性说法）"},

      {c:"办事与文件",p:"Mam wszystkie dokumenty.",z:"我所有的文件都带齐了。"},
      {c:"办事与文件",p:"Brakuje mi jednego dokumentu.",z:"我还缺一份文件。"},

      {c:"办事与文件",p:"Czy potrzebuję tłumaczenia przysięgłego?",z:"我需要宣誓翻译件吗？"},

      {c:"紧急情况",p:"Proszę mi pomóc!",z:"请帮帮我！"},

      {c:"紧急情况",p:"Zgubiłem telefon.",z:"我的手机丢了。（男性说法）"},
      {c:"紧急情况",p:"Nie mogę znaleźć adresu.",z:"我找不到这个地址。"},
      {c:"紧急情况",p:"Potrzebuję pomocy.",z:"我需要帮助。"},
      {c:"紧急情况",p:"Proszę zadzwonić pod numer 112.",z:"请拨打 112。"},
      {c:"紧急情况",p:"Czy wszystko w porządku?",z:"一切都还好吗？"}
    ];

    const STORAGE_KEY = "polskiDailyProgress_v2";

    let learned = new Set();
    let later = new Set();
    let activeCategory = "全部场景";
    let activeStatus = "all";
    let currentAudio = null;
    let isSpeaking = false;

    const categories = [
      "全部场景",
      ...new Set(sentences.map(s => s.c))
    ];

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        learned = new Set(saved.learned || []);
        later = new Set(saved.later || []);
      } catch (e) {
        learned = new Set();
        later = new Set();
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          learned: [...learned],
          later: [...later]
        }));
      } catch (e) {
        console.warn("无法保存学习进度：", e);
      }
      updateStats();
    }

    function updateStats() {
      document.getElementById("total-stat").textContent = sentences.length;
      document.getElementById("learned-stat").textContent = learned.size;
      document.getElementById("later-stat").textContent = later.size;
      document.getElementById("progress-pill").textContent =
        `已掌握 ${learned.size} 句`;
    }

    function renderCategoryFilters() {
      const container = document.getElementById("category-filters");
      container.innerHTML = "";

      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "filter-btn" +
          (activeCategory === category ? " active" : "");
        button.textContent = category;
        button.addEventListener("click", () => {
          activeCategory = category;
          renderCategoryFilters();
          renderSentences();
        });
        container.appendChild(button);
      });
    }

    function renderStatusFilters() {
      document.querySelectorAll("#status-filters button").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.status === activeStatus
        );
      });
    }

    function renderSentences() {
      const query = document.getElementById("search").value
        .trim().toLowerCase();

      const filtered = sentences
        .map((sentence, index) => ({ ...sentence, id: index }))
        .filter(s => {
          const matchesCategory =
            activeCategory === "全部场景" || s.c === activeCategory;

          const matchesQuery =
            !query ||
            s.p.toLowerCase().includes(query) ||
            s.z.toLowerCase().includes(query) ||
            s.c.toLowerCase().includes(query);

          const isLearned = learned.has(s.id);
          const isLater = later.has(s.id);

          const matchesStatus =
            activeStatus === "all" ||
            (activeStatus === "learned" && isLearned) ||
            (activeStatus === "unlearned" && !isLearned) ||
            (activeStatus === "later" && isLater);

          return matchesCategory && matchesQuery && matchesStatus;
        });

      const list = document.getElementById("sentence-list");
      document.getElementById("result-count").textContent =
        `${filtered.length} 句`;

      const title = activeCategory === "全部场景"
        ? "日常实用句子"
        : activeCategory;

      document.getElementById("list-title").textContent = title;
      list.innerHTML = "";

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔎</div>
            <strong>没有找到符合条件的句子</strong>
            <div style="margin-top:6px;font-size:13px">
              换个关键词，或者切换筛选条件试试。
            </div>
          </div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach(s => {
        const isLearned = learned.has(s.id);
        const isLater = later.has(s.id);

        const card = document.createElement("article");
        card.className = "sentence-card" + (isLearned ? " learned" : "");

        const top = document.createElement("div");
        top.className = "card-top";

        const main = document.createElement("div");
        main.className = "sentence-main";

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = s.c;

        const polish = document.createElement("div");
        polish.className = "polish";
        polish.textContent = s.p;

        const chinese = document.createElement("div");
        chinese.className = "chinese";
        chinese.textContent = s.z;

        main.append(category, polish, chinese);

        const play = document.createElement("button");
        play.className = "play-btn";
        play.type = "button";
        play.title = "播放波兰语发音";
        play.setAttribute("aria-label", "播放：" + s.p);
        play.innerHTML = "▶";
        play.addEventListener("click", () => playPolish(s.p, play));

        top.append(main, play);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const learnedButton = document.createElement("button");
        learnedButton.className = "action-btn" +
          (isLearned ? " is-learned" : "");
        learnedButton.textContent = isLearned ? "✓ 已经学会" : "✓ 标记为学会";
        learnedButton.addEventListener("click", () => {
          if (learned.has(s.id)) {
            learned.delete(s.id);
          } else {
            learned.add(s.id);
            later.delete(s.id);
          }
          saveProgress();
          renderSentences();
        });

        const laterButton = document.createElement("button");
        laterButton.className = "action-btn" +
          (isLater ? " is-later" : "");
        laterButton.textContent = isLater ? "★ 稍后再学" : "☆ 稍后学习";
        laterButton.addEventListener("click", () => {
          if (later.has(s.id)) {
            later.delete(s.id);
          } else {
            later.add(s.id);
          }
          saveProgress();
          renderSentences();
        });

        const copyButton = document.createElement("button");
        copyButton.className = "action-btn";
        copyButton.textContent = "复制波兰语";
        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(s.p);
            copyButton.textContent = "已复制 ✓";
            setTimeout(() => copyButton.textContent = "复制波兰语", 1200);
          } catch (e) {
            const area = document.createElement("textarea");
            area.value = s.p;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
            copyButton.textContent = "已复制 ✓";
            setTimeout(() => copyButton.textContent = "复制波兰语", 1200);
          }
        });

        actions.append(learnedButton, laterButton, copyButton);
        card.append(top, actions);
        fragment.appendChild(card);
      });

      list.appendChild(fragment);
    }

    // 优先尝试 Google Translate 的网页语音接口。
    // 该接口并非稳定的官方公开 API，因此保留浏览器语音备用方案。
    function googleTtsUrl(text) {
      return "https://translate.google.com/translate_tts" +
        "?ie=UTF-8&client=gtx&tl=pl&q=" + encodeURIComponent(text);
    }

    function browserSpeech(text) {
      return new Promise((resolve, reject) => {
        if (!("speechSynthesis" in window) ||
            !("SpeechSynthesisUtterance" in window)) {
          reject(new Error("当前浏览器不支持语音合成"));
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "pl-PL";
        utterance.rate = 0.85;
        utterance.pitch = 1;
        utterance.volume = 1;

        const voices = window.speechSynthesis.getVoices();
        const polishVoice = voices.find(v =>
          v.lang && v.lang.toLowerCase().startsWith("pl")
        );

        if (polishVoice) utterance.voice = polishVoice;

        utterance.onend = () => resolve();
        utterance.onerror = event => reject(
          new Error(event.error || "浏览器语音播放失败")
        );

        window.speechSynthesis.speak(utterance);
      });
    }

    async function playPolish(text, button) {
      if (isSpeaking) {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        isSpeaking = false;
        document.querySelectorAll(".play-btn").forEach(b => {
          b.disabled = false;
          b.innerHTML = "▶";
        });
        return;
      }

      isSpeaking = true;
      button.disabled = true;
      button.innerHTML = "…";

      const resetButtons = () => {
        isSpeaking = false;
        currentAudio = null;
        document.querySelectorAll(".play-btn").forEach(b => {
          b.disabled = false;
          b.innerHTML = "▶";
        });
      };

      try {
        const audio = new Audio();
        currentAudio = audio;
        audio.preload = "auto";
        audio.referrerPolicy = "no-referrer";
        audio.src = googleTtsUrl(text);

        await new Promise((resolve, reject) => {
          let settled = false;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            audio.onended = null;
            audio.onerror = null;
            if (error) reject(error);
            else resolve();
          };

          const timeout = setTimeout(
            () => finish(new Error("Google 语音连接超时")),
            9000
          );

          audio.onended = () => finish();
          audio.onerror = () => finish(new Error("Google 语音无法播放"));

          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(error => finish(error));
          }
        });

        resetButtons();
      } catch (googleError) {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }

        try {
          await browserSpeech(text);
          resetButtons();
        } catch (fallbackError) {
          resetButtons();
          alert(
            "语音播放失败。\n\n" +
            "请检查网络连接，并确认手机浏览器支持波兰语语音。\n" +
            "如果仍然无法播放，可以尝试用 Chrome 打开网站。"
          );
          console.error("Google TTS:", googleError);
          console.error("浏览器语音:", fallbackError);
        }
      }
    }

    document.getElementById("search").addEventListener("input", renderSentences);

    document.querySelectorAll("#status-filters button").forEach(button => {
      button.addEventListener("click", () => {
        activeStatus = button.dataset.status;
        renderStatusFilters();
        renderSentences();
      });
    });

    loadProgress();
    renderCategoryFilters();
    renderStatusFilters();
    updateStats();
    renderSentences();
  </script>
