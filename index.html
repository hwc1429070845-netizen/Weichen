const STORAGE_KEY = "polskiDailyProgress_v2";
let learned = new Set(), later = new Set();
let activeCategory = "全部场景", activeStatus = "all", query = "";
let currentAudio = null, isSpeaking = false;
const categories = ["全部场景", ...new Set(sentences.map(s => s.c))];
const $ = id => document.getElementById(id);

function loadProgress(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    learned = new Set(saved.learned || []);
    later = new Set(saved.later || []);
  }catch(e){ learned = new Set(); later = new Set(); }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({learned:[...learned], later:[...later]})); }catch(e){}
}
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderCategories(){
  $("category-filters").innerHTML = categories.map(c =>
    `<button class="filter-btn${c===activeCategory?" active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function updateStats(){
  $("total-stat").textContent = sentences.length;
  $("learned-stat").textContent = learned.size;
  $("later-stat").textContent = later.size;
  $("progress-pill").textContent = `已掌握 ${learned.size} 句`;
}
function filtered(){
  const q = query.trim().toLowerCase();
  return sentences.filter(s => {
    if (activeCategory !== "全部场景" && s.c !== activeCategory) return false;
    if (activeStatus === "learned" && !learned.has(s.p)) return false;
    if (activeStatus === "later" && !later.has(s.p)) return false;
    if (activeStatus === "unlearned" && learned.has(s.p)) return false;
    if (q && !(s.p.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.c.toLowerCase().includes(q))) return false;
    return true;
  });
}
function render(){
  const list = filtered();
  $("list-title").textContent = activeCategory === "全部场景" ? "日常实用句子" : activeCategory;
  $("result-count").textContent = `${list.length} 句`;
  if (!list.length){
    $("sentence-list").innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>没有找到符合条件的句子</div>`;
  } else {
    $("sentence-list").innerHTML = list.map(s => {
      const i = sentences.indexOf(s);
      const L = learned.has(s.p), T = later.has(s.p);
      return `<article class="sentence-card${L?" learned":""}">
<div class="card-top"><div class="sentence-main"><span class="category">${esc(s.c)}</span>
<div class="polish">${esc(s.p)}</div><div class="chinese">${esc(s.z)}</div></div>
<button class="play-btn" data-play="${i}" aria-label="播放发音">🔊</button></div>
<div class="card-actions">
<button class="action-btn${L?" is-learned":""}" data-learn="${i}">${L?"✓ 已学会":"标记已学会"}</button>
<button class="action-btn${T?" is-later":""}" data-later="${i}">${T?"★ 稍后学习":"稍后学习"}</button>
<button class="action-btn" data-copy="${i}">复制</button></div></article>`;
    }).join("");
  }
  updateStats();
}

function fallbackSpeak(text, btn){
  if (!("speechSynthesis" in window)){ finish(btn); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pl-PL"; u.rate = .9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("pl"));
  if (v) u.voice = v;
  u.onend = u.onerror = () => finish(btn);
  speechSynthesis.speak(u);
}
function finish(btn){ isSpeaking = false; if (btn) btn.disabled = false; }
function speak(text, btn){
  if (isSpeaking) return;
  isSpeaking = true; btn.disabled = true;
  if (currentAudio){ currentAudio.pause(); currentAudio = null; }
  if (!navigator.onLine){ fallbackSpeak(text, btn); return; }
  const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pl&q=" + encodeURIComponent(text);
  const audio = new Audio(url);
  currentAudio = audio;
  let failed = false;
  const fail = () => { if (failed) return; failed = true; fallbackSpeak(text, btn); };
  audio.onended = () => finish(btn);
  audio.onerror = fail;
  audio.play().catch(fail);
  setTimeout(() => { if (!failed && audio.readyState < 2) { audio.pause(); fail(); } }, 4000);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.cat){ activeCategory = t.dataset.cat; renderCategories(); render(); }
  else if (t.dataset.status){
    activeStatus = t.dataset.status;
    document.querySelectorAll("#status-filters .filter-btn").forEach(b => b.classList.toggle("active", b === t));
    render();
  }
  else if (t.dataset.play) speak(sentences[+t.dataset.play].p, t);
  else if (t.dataset.learn){
    const p = sentences[+t.dataset.learn].p;
    if (learned.has(p)) learned.delete(p); else { learned.add(p); later.delete(p); }
    saveProgress(); render();
  }
  else if (t.dataset.later){
    const p = sentences[+t.dataset.later].p;
    if (later.has(p)) later.delete(p); else { later.add(p); learned.delete(p); }
    saveProgress(); render();
  }
  else if (t.dataset.copy){
    const p = sentences[+t.dataset.copy].p;
    if (navigator.clipboard) navigator.clipboard.writeText(p).then(() => { t.textContent = "已复制"; setTimeout(render, 900); });
  }
});
$("search").addEventListener("input", e => { query = e.target.value; render(); });
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

loadProgress(); renderCategories(); render();

/* ---------- PWA：图标、manifest、离线、安装按钮 ---------- */
(function setupPWA(){
  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(() => {});
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e; $("install-btn").style.display = "inline-block";
  });
  $("install-btn").addEventListener("click", async () => {
    if (!deferred) return; deferred.prompt(); await deferred.userChoice;
    deferred = null; $("install-btn").style.display = "none";
  });
  window.addEventListener("appinstalled", () => { $("install-btn").style.display = "none"; });
})();
</script>
